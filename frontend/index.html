<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CSV Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-soft: #eaeef4;
    --border: #dde2ea;
    --text: #1a212c;
    --text-muted: #5c6578;
    --accent: #0f6e64;
    --accent-contrast: #ffffff;
    --accent-soft: #e2f1ee;
    --ok-bg: #dff3e6; --ok-text: #146c3f;
    --warn-bg: #fdf0d5; --warn-text: #92600a;
    --danger-bg: #fbe4e2; --danger-text: #a3271f;
    --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 4px 10px rgba(20, 30, 40, .04);
    --font-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-data: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #191d25;
      --surface-soft: #1f2530;
      --border: #2a313d;
      --text: #e7eaf0;
      --text-muted: #97a1b3;
      --accent: #4fbfae;
      --accent-contrast: #08211d;
      --accent-soft: #163531;
      --ok-bg: #133c26; --ok-text: #6fdb9e;
      --warn-bg: #3c2c0c; --warn-text: #f0b953;
      --danger-bg: #3d1c1a; --danger-text: #f2a39c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #191d25; --surface-soft: #1f2530; --border: #2a313d;
    --text: #e7eaf0; --text-muted: #97a1b3; --accent: #4fbfae; --accent-contrast: #08211d;
    --accent-soft: #163531;
    --ok-bg: #133c26; --ok-text: #6fdb9e;
    --warn-bg: #3c2c0c; --warn-text: #f0b953;
    --danger-bg: #3d1c1a; --danger-text: #f2a39c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9; --surface: #ffffff; --surface-soft: #eaeef4; --border: #dde2ea;
    --text: #1a212c; --text-muted: #5c6578; --accent: #0f6e64; --accent-contrast: #ffffff;
    --accent-soft: #e2f1ee;
    --ok-bg: #dff3e6; --ok-text: #146c3f;
    --warn-bg: #fdf0d5; --warn-text: #92600a;
    --danger-bg: #fbe4e2; --danger-text: #a3271f;
    --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 4px 10px rgba(20, 30, 40, .04);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  header.page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
  }
  header.page-head h1 {
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  header.page-head p {
    margin: .25rem 0 0;
    color: var(--text-muted);
    font-size: .9rem;
  }
  .eyebrow {
    display: inline-block;
    font-family: var(--font-data);
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: .2rem .55rem;
    border-radius: 5px;
  }

  section { margin-top: 2rem; }
  section > h2 {
    font-size: .78rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--text-muted);
    margin: 0 0 .75rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  form#upload-form {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: 1rem 1.1rem;
  }
  .file-drop {
    flex: 1;
    display: flex;
    align-items: center;
    gap: .6rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: .55rem .8rem;
    background: var(--surface-soft);
    color: var(--text-muted);
    font-size: .88rem;
  }
  .file-drop input[type="file"] {
    flex: 1;
    font: inherit;
    color: var(--text);
  }
  .file-drop input[type="file"]::file-selector-button {
    font: inherit;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 6px;
    padding: .4rem .7rem;
    margin-right: .7rem;
    cursor: pointer;
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: .88rem;
    padding: .55rem 1.1rem;
    border-radius: 7px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-contrast);
    cursor: pointer;
    transition: filter .12s ease;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  button.secondary {
    background: transparent;
    color: var(--text-muted);
    border-color: var(--border);
  }
  button.secondary:hover { color: var(--danger-text); border-color: var(--danger-text); }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #message {
    margin-top: .6rem;
    font-size: .85rem;
    color: var(--text-muted);
    min-height: 1.2em;
  }
  #message[data-tone="error"] { color: var(--danger-text); }
  #message[data-tone="success"] { color: var(--ok-text); }

  .table-wrap { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .87rem; }
  thead th {
    text-align: left;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-muted);
    font-weight: 650;
    padding: .65rem .8rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: .6rem .8rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-soft); }
  td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  td.filename { font-weight: 600; }
  td.mono, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    padding: .2rem .55rem;
    border-radius: 999px;
    font-size: .72rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .status-pill::before {
    content: "";
    width: .4rem;
    height: .4rem;
    border-radius: 50%;
    background: currentColor;
  }
  .status-pending, .status-running { background: var(--warn-bg); color: var(--warn-text); }
  .status-done { background: var(--ok-bg); color: var(--ok-text); }
  .status-failed { background: var(--danger-bg); color: var(--danger-text); }
  @media (prefers-reduced-motion: no-preference) {
    .status-running::before { animation: pulse 1.4s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .row-actions { display: flex; gap: .4rem; justify-content: flex-end; }
  .row-actions button { padding: .3rem .65rem; font-size: .78rem; }

  .empty-state {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--text-muted);
    font-size: .88rem;
  }

  #detail:empty { display: none; }
  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.1rem .3rem;
  }
  .detail-head h3 { margin: 0; font-size: 1.02rem; font-weight: 650; }
  .detail-error {
    margin: 0 1.1rem 1.1rem;
    padding: .7rem .9rem;
    background: var(--danger-bg);
    color: var(--danger-text);
    border-radius: 8px;
    font-size: .85rem;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-tile {
    background: var(--surface);
    padding: .8rem 1.1rem;
  }
  .stat-tile .value {
    display: block;
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    font-weight: 650;
  }
  .stat-tile .label {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-muted);
  }

  .detail-table-wrap { padding: 1.1rem; padding-top: .9rem; }
</style>
</head>
<body>
<main>

  <header class="page-head">
    <div>
      <span class="eyebrow">Analyse CSV</span>
      <h1>CSV Analyzer</h1>
      <p>Déposez un fichier, le worker le profile en arrière-plan pendant que vous continuez.</p>
    </div>
  </header>

  <section>
    <h2>Nouveau job</h2>
    <form id="upload-form" class="card">
      <label class="file-drop">
        <input type="file" id="file-input" accept=".csv" required>
      </label>
      <button type="submit" id="submit-btn">Analyser</button>
    </form>
    <p id="message"></p>
  </section>

  <section>
    <h2>Jobs</h2>
    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fichier</th>
            <th>Statut</th>
            <th class="num">Lignes</th>
            <th class="num">Colonnes</th>
            <th>Créé</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" hidden>Aucun job pour le moment — uploadez un CSV pour commencer.</div>
    </div>
  </section>

  <section>
    <div id="detail" class="card"></div>
  </section>

</main>

<script>
const API_BASE = "";

async function api(path, options) {
  const res = await fetch(API_BASE + path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Erreur HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function statusLabel(status) {
  const labels = { pending: "en attente", running: "en cours", done: "terminé", failed: "échec" };
  return labels[status] ?? status;
}

function statusBadge(status) {
  return `<span class="status-pill status-${status}">${statusLabel(status)}</span>`;
}

function formatBytes(bytes) {
  if (bytes == null) return "-";
  if (bytes < 1024) return `${bytes} o`;
  return `${(bytes / 1024).toFixed(1)} Ko`;
}

async function loadJobs() {
  const data = await api("/jobs?limit=50");
  const body = document.getElementById("jobs-body");
  const emptyState = document.getElementById("empty-state");
  body.innerHTML = "";

  emptyState.hidden = data.items.length > 0;

  for (const job of data.items) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="filename">${escapeHtml(job.filename)}</td>
      <td>${statusBadge(job.status)}</td>
      <td class="num">${job.row_count ?? "-"}</td>
      <td class="num">${job.column_count ?? "-"}</td>
      <td class="mono" style="color:var(--text-muted)">${new Date(job.created_at).toLocaleString("fr-FR")}</td>
      <td>
        <div class="row-actions">
          <button data-action="view" data-id="${job.id}">Voir</button>
          <button data-action="delete" data-id="${job.id}" class="secondary">Supprimer</button>
        </div>
      </td>`;
    body.appendChild(tr);
  }
}

async function viewJob(jobId) {
  const job = await api(`/jobs/${jobId}`);
  const detail = document.getElementById("detail");

  if (job.status !== "done") {
    detail.innerHTML = `
      <div class="detail-head">
        <h3>${escapeHtml(job.filename)}</h3>
        ${statusBadge(job.status)}
      </div>
      ${job.error ? `<p class="detail-error">${escapeHtml(job.error)}</p>` : `<p class="detail-error" style="background:var(--surface-soft);color:var(--text-muted)">En cours de traitement…</p>`}
    `;
    return;
  }

  const rows = job.columns.map(c => `
    <tr>
      <td class="filename">${escapeHtml(c.column_name)}</td>
      <td class="mono">${escapeHtml(c.dtype)}</td>
      <td class="num">${c.null_count} <span style="color:var(--text-muted)">(${c.null_pct}%)</span></td>
      <td class="num">${c.unique_count}</td>
      <td class="num">${c.mean ?? "-"}</td>
      <td class="num">${c.std ?? "-"}</td>
      <td class="num">${c.min ?? "-"}</td>
      <td class="num">${c.max ?? "-"}</td>
      <td>${c.top_value != null ? escapeHtml(c.top_value) : "-"}</td>
    </tr>`).join("");

  detail.innerHTML = `
    <div class="detail-head">
      <h3>${escapeHtml(job.filename)}</h3>
      ${statusBadge(job.status)}
    </div>
    <div class="stat-row">
      <div class="stat-tile"><span class="value">${job.row_count}</span><span class="label">Lignes</span></div>
      <div class="stat-tile"><span class="value">${job.column_count}</span><span class="label">Colonnes</span></div>
      <div class="stat-tile"><span class="value">${job.duplicate_count}</span><span class="label">Doublons</span></div>
      <div class="stat-tile"><span class="value">${formatBytes(job.file_size_bytes)}</span><span class="label">Taille</span></div>
    </div>
    <div class="detail-table-wrap table-wrap">
      <table>
        <thead>
          <tr>
            <th>Colonne</th><th>Type</th><th class="num">Nulls</th><th class="num">Distinctes</th>
            <th class="num">Moyenne</th><th class="num">Écart-type</th><th class="num">Min</th><th class="num">Max</th><th>Top valeur</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("file-input");
  const submitBtn = document.getElementById("submit-btn");
  const message = document.getElementById("message");
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  submitBtn.disabled = true;
  message.dataset.tone = "";
  message.textContent = "Envoi en cours…";
  try {
    const result = await api("/jobs", { method: "POST", body: formData });
    message.dataset.tone = "success";
    message.textContent = `Job créé — statut : ${statusLabel(result.status)}`;
    fileInput.value = "";
    await loadJobs();
  } catch (err) {
    message.dataset.tone = "error";
    message.textContent = "Erreur : " + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById("jobs-body").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === "view") {
    await viewJob(id);
  } else if (btn.dataset.action === "delete") {
    if (confirm("Supprimer ce job et son fichier ?")) {
      await api(`/jobs/${id}`, { method: "DELETE" });
      await loadJobs();
    }
  }
});

loadJobs();
setInterval(loadJobs, 4000);
</script>
</body>
</html>
